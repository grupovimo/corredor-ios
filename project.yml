# El proyecto de Xcode sale de acá: `xcodegen generate` (el .xcodeproj no se versiona).
name: Corredor
options:
  bundleIdPrefix: ar.com.corredor
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: M6935MSNQB
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Corredor:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Corredor.xcconfig
      Release: Config/Corredor.xcconfig
    sources:
      - path: Corredor
      - path: Compartido
    dependencies:
      - target: CorredorWidgets
    entitlements:
      path: Corredor/Corredor.entitlements
      properties:
        # development en Debug (lo instalado desde Xcode), production en Release.
        aps-environment: $(APS_ENTORNO)
        # La sesión, compartida con los widgets y la Live Activity.
        keychain-access-groups:
          - $(AppIdentifierPrefix)ar.com.corredor.app
        com.apple.developer.applesignin:
          - Default
        # Universal Links: las invitaciones y los links del panel abren la app (apple-app-site-association en la web).
        com.apple.developer.associated-domains:
          - applinks:corredor.com.ar
          - webcredentials:corredor.com.ar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.corredor.app
        PRODUCT_NAME: Corredor
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          APS_ENTORNO: development
        Release:
          APS_ENTORNO: production
          # TestFlight por GitHub Actions con firma manual (testflight.yml): un perfil por target.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ar.com.corredor.app App Store
    info:
      path: Corredor/Info.plist
      properties:
        CFBundleDisplayName: Corredor
        CFBundleDevelopmentRegion: es-AR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CorredorApi: $(CORREDOR_API)
        CorredorWeb: $(CORREDOR_WEB)
        ClerkPublicable: $(CLERK_PUBLICABLE)
        CorredorGrupoLlavero: $(AppIdentifierPrefix)ar.com.corredor.app
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          # corredor://propiedad/{id}, corredor://chat/{id}… (push, widgets, Siri y Spotlight).
          - CFBundleURLName: ar.com.corredor.app.enlaces
            CFBundleURLSchemes: [corredor]
          # La vuelta del ingreso con Google por Clerk.
          - CFBundleURLName: ar.com.corredor.app
            CFBundleURLSchemes: [ar.com.corredor.app]
        UIAppFonts:
          - Geist-400.ttf
          - Geist-600.ttf
          - Geist-700.ttf
          - Geist-800.ttf
        UILaunchScreen:
          UIColorName: Fondo
          UIImageName: Lanzamiento
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification, fetch]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Para entrar a Corredor sin escribir nada y confirmar lo sensible, como borrar la cuenta."
        NSCameraUsageDescription: "Para que MIRA lea los carteles de «Vende» y para sacarles fotos a las propiedades."
        NSPhotoLibraryUsageDescription: "Para sumar fotos de tus propiedades y adjuntar comprobantes."
        NSPhotoLibraryAddUsageDescription: "Para guardar en tus fotos las placas para compartir."
        NSMicrophoneUsageDescription: "Para dictar la descripción de una propiedad."
        NSSpeechRecognitionUsageDescription: "Para pasar a texto lo que dictás."
        NSLocationWhenInUseUsageDescription: "Para ubicar el cartel que MIRA fotografía y ordenar la cartera por cercanía."
        NSContactsUsageDescription: "Para traer un contacto de tu agenda sin tipearlo."
        NSCalendarsWriteOnlyAccessUsageDescription: "Para sumar tus visitas al calendario del iPhone."
        NSUserActivityTypes: [ar.com.corredor.app.propiedad, ar.com.corredor.app.contacto]
        LSApplicationQueriesSchemes: [whatsapp, comgooglemaps]
        NSAppTransportSecurity:
          # Sólo para probar contra la API local (http://127.0.0.1:4100).
          NSAllowsLocalNetworking: true
  CorredorWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Corredor.xcconfig
      Release: Config/Corredor.xcconfig
    sources:
      - path: CorredorWidgets
      - path: Compartido
    entitlements:
      path: CorredorWidgets/CorredorWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)ar.com.corredor.app
    info:
      path: CorredorWidgets/Info.plist
      properties:
        CFBundleDisplayName: Corredor
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CorredorApi: $(CORREDOR_API)
        CorredorWeb: $(CORREDOR_WEB)
        ClerkPublicable: $(CLERK_PUBLICABLE)
        CorredorGrupoLlavero: $(AppIdentifierPrefix)ar.com.corredor.app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.corredor.app.Widgets
        PRODUCT_NAME: CorredorWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ar.com.corredor.app.Widgets App Store
  CorredorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CorredorTests]
    dependencies:
      - target: Corredor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # Recorridos de punta a punta (XCUITest) contra la API grabada: PruebasUI/ y el paso «Recorridos» del CI.
  CorredorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CorredorUITests]
    dependencies:
      - target: Corredor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Corredor
schemes:
  Corredor:
    build:
      targets:
        Corredor: all
        CorredorTests: [test]
        CorredorUITests: [test]
    test:
      targets: [CorredorTests, CorredorUITests]
